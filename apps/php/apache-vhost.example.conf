# Enable mod_rewrite; set these paths to the repository on your own machine.
<VirtualHost *:80>
    ServerName talentflow.local
    DocumentRoot "C:/Users/Administrator/Desktop/CV-Screening/apps/php/public"
    <Directory "C:/Users/Administrator/Desktop/CV-Screening/apps/php/public">
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>
