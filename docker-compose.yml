version: "3.9"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cvscreening
      MYSQL_USER: cvuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Demo@12345}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_demo}
    ports:
      - "33306:3306"
    volumes:
      - mysql_php_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/php/Dockerfile
    environment: &php_environment
      APP_URL: http://localhost:8080
      DB_DSN: mysql:host=mysql;dbname=cvscreening;charset=utf8mb4
      DB_USER: cvuser
      DB_PASSWORD: ${MYSQL_PASSWORD:-Demo@12345}
      JWT_SECRET: ${JWT_SECRET:-cvscreening_default_secret_at_least_32_chars_long}
      AI_SERVICE_URL: http://ai-service:8000
    command: ["php", "bin/console.php", "migrate"]
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/php/Dockerfile
    environment: *php_environment
    ports:
      - "8080:80"
    volumes:
      - php_files:/var/www/platform/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/php/Dockerfile
    environment: *php_environment
    command: ["php", "bin/console.php", "worker"]
    volumes:
      - php_files:/var/www/platform/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile.php
    environment:
      CACHE_DRIVER: file
      CACHE_DIR: /app/.screening-cache
    ports:
      - "8000:8000"
    volumes:
      - ai_php_cache:/app/.screening-cache

volumes:
  mysql_php_data:
  php_files:
  ai_php_cache:
